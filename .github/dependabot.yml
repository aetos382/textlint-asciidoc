# 依存関係の更新は基本的に Renovate（renovate.json）で行う。
# devcontainer の features だけは、Renovate が devcontainer-lock.json を更新できないため Dependabot で更新する。
version: 2
updates:
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    cooldown:
      default-days: 3
